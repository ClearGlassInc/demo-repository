name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    name: Assign new issue or pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign owner
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ASSIGNEE: dezzy711
        run: |
          set -euo pipefail
          test -n "${ISSUE_NUMBER}"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            --data "{\"assignees\":[\"${ASSIGNEE}\"]}"
